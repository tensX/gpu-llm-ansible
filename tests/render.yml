---
# Рендер шаблонов docker compose с переменными из group_vars, чтобы в CI проверить их
# через "docker compose config":
#   ansible-playbook -i localhost, tests/render.yml -e render_dir=/tmp/compose
- name: Рендер шаблонов docker compose
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    render_dir: /tmp/compose
    # Не секрет: файл нужен только для проверки синтаксиса compose.
    vllm_api_key: "render-only-not-a-secret"
    hf_token: ""
    render_templates: [docker-compose.yml, vllm.env]

  tasks:
    - name: Каталоги вариантов
      ansible.builtin.file:
        path: "{{ render_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [vllm-default, vllm-gpu-list, monitoring]

    - name: Шаблоны vLLM с настройками из group_vars
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/roles/vllm/templates/{{ item }}.j2"
        dest: "{{ render_dir }}/vllm-default/{{ item }}"
        mode: "0644"
      loop: "{{ render_templates }}"

    - name: Шаблоны vLLM со списком GPU, своими аргументами и HF_TOKEN
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/roles/vllm/templates/{{ item }}.j2"
        dest: "{{ render_dir }}/vllm-gpu-list/{{ item }}"
        mode: "0644"
      vars:
        vllm_gpus: "0,1"
        vllm_extra_args: ["--quantization", "awq"]
        hf_token: "hf_render_only"
      loop: "{{ render_templates }}"

    - name: Шаблон мониторинга
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/roles/monitoring/templates/docker-compose.yml.j2"
        dest: "{{ render_dir }}/monitoring/docker-compose.yml"
        mode: "0644"
