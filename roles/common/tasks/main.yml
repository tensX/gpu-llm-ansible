---
- name: Обновить кеш apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Базовые пакеты
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Часовой пояс
  community.general.timezone:
    name: "{{ timezone }}"

# Образы провайдеров бывают со своими правилами ufw, например с открытым диапазоном
# 3000:10000, куда попадают порты экспортеров. Первый прогон сбрасывает ufw, чтобы
# снаружи было открыто только описанное ниже; старые правила ufw сохраняет рядом
# (/etc/ufw/*.rules.<дата>). Повторные прогоны и правила, добавленные позже, не трогаются.
- name: Проверить, настраивал ли плейбук ufw раньше
  ansible.builtin.stat:
    path: /etc/ufw/.ansible-managed
  register: common_ufw_marker

- name: Сбросить ufw при первом прогоне
  ansible.builtin.command: ufw --force reset
  changed_when: true
  when:
    - ufw_reset_on_first_run | bool
    - not common_ufw_marker.stat.exists

# Сначала правило для SSH, потом политика deny и включение: доступ не теряется.
- name: Правило ufw для SSH
  community.general.ufw:
    rule: "{{ ssh_ufw_rule }}"
    port: "{{ ssh_port | string }}"
    proto: tcp

- name: Порты шлюза API
  ansible.builtin.set_fact:
    common_gateway_ports: "{{ [gateway_port] + ([gateway_tls_port] if gateway_tls_enabled | bool else []) }}"

- name: Правило ufw для API через nginx (со всех адресов)
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ common_gateway_ports }}"
  when: api_allowed_cidrs | length == 0

- name: Правило ufw для API через nginx (только разрешенные сети)
  community.general.ufw:
    rule: allow
    port: "{{ item.1 | string }}"
    proto: tcp
    from_ip: "{{ item.0 }}"
  loop: "{{ api_allowed_cidrs | product(common_gateway_ports) | list }}"

- name: Правило ufw для метрик (только сеть мониторинга)
  community.general.ufw:
    rule: allow
    port: "{{ item.1 | string }}"
    proto: tcp
    from_ip: "{{ item.0 }}"
  loop: "{{ metrics_allowed_cidrs | product([dcgm_exporter_port, node_exporter_port]) | list }}"
  when: monitoring_enabled | bool

- name: Политика ufw (входящие закрыты, исходящие открыты)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Включить ufw
  community.general.ufw:
    state: enabled

- name: Отметить, что ufw настроен плейбуком
  ansible.builtin.copy:
    dest: /etc/ufw/.ansible-managed
    content: "ufw настроен Ansible (роль common). Пока этот файл есть, плейбук не сбрасывает ufw.\n"
    owner: root
    group: root
    mode: "0644"
