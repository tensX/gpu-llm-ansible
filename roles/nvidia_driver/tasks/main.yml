---
- name: Установить pciutils (lspci)
  ansible.builtin.apt:
    name: pciutils
    state: present

- name: Проверить, есть ли GPU NVIDIA на шине PCI
  ansible.builtin.shell: set -o pipefail && lspci -nn | grep -i nvidia
  args:
    executable: /bin/bash
  register: nvidia_driver_pci
  changed_when: false
  failed_when: nvidia_driver_pci.rc not in [0, 1]
  check_mode: false

- name: Остановиться, если GPU NVIDIA нет
  ansible.builtin.fail:
    msg: >-
      GPU NVIDIA не найден (lspci). Для сервера без GPU запускайте
      с --skip-tags nvidia,vllm,monitoring,verify
  when: nvidia_driver_pci.rc != 0

- name: Проверить, работает ли драйвер сейчас
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_driver_smi_before
  changed_when: false
  failed_when: false
  check_mode: false

# Образы GPU-провайдеров часто идут с уже установленным драйвером. Рабочий драйвер
# не трогаем (иначе замена ветки и лишняя перезагрузка), если не задано обратное.
- name: Решить, ставить ли драйвер
  ansible.builtin.set_fact:
    nvidia_driver_install: >-
      {{ nvidia_driver_smi_before.rc != 0 or not (nvidia_driver_keep_existing | bool) }}

- name: Сообщить, что рабочий драйвер оставлен как есть
  ansible.builtin.debug:
    msg: >-
      Найден рабочий драйвер {{ nvidia_driver_smi_before.stdout_lines | first | default('') }},
      установка пропущена (nvidia_driver_keep_existing=true)
  when: not (nvidia_driver_install | bool)

- name: Установка драйвера
  when: nvidia_driver_install | bool
  block:
    - name: Заголовки ядра и ubuntu-drivers
      ansible.builtin.apt:
        name:
          - "linux-headers-{{ ansible_facts['kernel'] }}"
          - ubuntu-drivers-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Установить рекомендованный драйвер (ubuntu-drivers)
      ansible.builtin.command: ubuntu-drivers install --gpgpu
      register: nvidia_driver_install_auto
      changed_when: true
      when: nvidia_driver_version == "auto"

    - name: Имена пакетов драйвера заданной ветки
      ansible.builtin.set_fact:
        nvidia_driver_packages:
          - "nvidia-driver-{{ nvidia_driver_version }}{{ ('-' ~ nvidia_driver_flavor) if nvidia_driver_flavor else '' }}"
          - "nvidia-utils-{{ nvidia_driver_version }}{{ '-server' if nvidia_driver_flavor is search('server') else '' }}"
      when: nvidia_driver_version != "auto"

    - name: Установить драйвер заданной ветки
      ansible.builtin.apt:
        name: "{{ nvidia_driver_packages }}"
        state: present
      register: nvidia_driver_install_pkg
      when: nvidia_driver_version != "auto"

    - name: Зафиксировать пакеты драйвера (apt hold)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ nvidia_driver_packages | default([]) }}"
      when:
        - nvidia_driver_version != "auto"
        - nvidia_driver_hold | bool
        - not ansible_check_mode

- name: Проверить флаг reboot-required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: nvidia_driver_reboot_flag

# Перезагрузка нужна, только если драйвер только что поставлен
# или драйвер не отвечал, а система ждет перезагрузки. Повторный прогон ничего не перезагружает.
- name: Решить, нужна ли перезагрузка
  ansible.builtin.set_fact:
    nvidia_driver_need_reboot: >-
      {{ (nvidia_driver_install_pkg is changed)
         or (nvidia_driver_install_auto is changed)
         or (nvidia_driver_smi_before.rc != 0 and nvidia_driver_reboot_flag.stat.exists) }}

- name: Остановиться, если нужна перезагрузка, а она запрещена
  ansible.builtin.fail:
    msg: >-
      Драйвер установлен, нужна перезагрузка. Перезагрузите сервер вручную
      или задайте nvidia_reboot_allowed=true и запустите плейбук снова.
  when:
    - nvidia_driver_need_reboot | bool
    - not (nvidia_reboot_allowed | bool)
    - not ansible_check_mode

- name: Перезагрузить сервер после установки драйвера
  ansible.builtin.reboot:
    reboot_timeout: "{{ nvidia_reboot_timeout }}"
    msg: "Reboot after NVIDIA driver install (Ansible)"
  when:
    - nvidia_driver_need_reboot | bool
    - nvidia_reboot_allowed | bool

- name: Проверить драйвер через nvidia-smi
  ansible.builtin.command: nvidia-smi
  register: nvidia_driver_smi_after
  changed_when: false
  when: not ansible_check_mode

- name: Вывод nvidia-smi
  ansible.builtin.debug:
    var: nvidia_driver_smi_after.stdout_lines
  when: not ansible_check_mode

# Режим MIG хранится на самой карте и переживает переустановку ОС и смену арендатора у
# провайдера. С MIG без GPU-инстансов CUDA не видит карту (cuInit 100), а vLLM здесь берет
# GPU целиком. Строки вида "0, Enabled, Disabled": индекс, режим сейчас, режим после сброса.
- name: Режим MIG на GPU
  ansible.builtin.command: nvidia-smi --query-gpu=index,mig.mode.current,mig.mode.pending --format=csv,noheader
  register: nvidia_driver_mig
  changed_when: false
  when:
    - nvidia_mig_disable | bool
    - not ansible_check_mode

- name: Выключить MIG
  ansible.builtin.command: nvidia-smi -i {{ item }} -mig 0
  loop: "{{ nvidia_driver_mig.stdout_lines | default([]) | select('search', ', Enabled$') | map('regex_replace', ',.*$', '') | list }}"
  changed_when: true
  when:
    - nvidia_mig_disable | bool
    - not ansible_check_mode

# Новый режим применяется после сброса GPU; в виртуальной машине надежнее перезагрузить сервер.
- name: Остановиться, если для выключения MIG нужна перезагрузка, а она запрещена
  ansible.builtin.fail:
    msg: >-
      MIG выключен, но заработает только после перезагрузки. Перезагрузите сервер вручную
      или задайте nvidia_reboot_allowed=true и запустите плейбук снова.
  when:
    - nvidia_mig_disable | bool
    - nvidia_driver_mig.stdout | default('') is search(', Enabled,')
    - not (nvidia_reboot_allowed | bool)
    - not ansible_check_mode

- name: Перезагрузить сервер, чтобы выключение MIG вступило в силу
  ansible.builtin.reboot:
    reboot_timeout: "{{ nvidia_reboot_timeout }}"
    msg: "Reboot to apply MIG mode change (Ansible)"
  when:
    - nvidia_mig_disable | bool
    - nvidia_driver_mig.stdout | default('') is search(', Enabled,')
    - nvidia_reboot_allowed | bool
    - not ansible_check_mode

- name: Режим MIG после выключения
  ansible.builtin.command: nvidia-smi --query-gpu=index,mig.mode.current --format=csv,noheader
  register: nvidia_driver_mig_after
  changed_when: false
  when:
    - nvidia_mig_disable | bool
    - nvidia_driver_mig.stdout | default('') is search('Enabled')
    - not ansible_check_mode

- name: MIG выключен
  ansible.builtin.assert:
    that: nvidia_driver_mig_after.stdout is not search(', Enabled')
    fail_msg: >-
      MIG остался включен и после перезагрузки. В виртуальной машине режим MIG может
      менять только провайдер: обратитесь к нему или задайте nvidia_mig_disable=false
      и укажите MIG-инстанс в vllm_gpus.
    quiet: true
  when:
    - nvidia_mig_disable | bool
    - nvidia_driver_mig.stdout | default('') is search('Enabled')
    - not ansible_check_mode
