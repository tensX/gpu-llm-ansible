---
- name: Каталог для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Ключ репозитория Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Новая инструкция Docker создает docker.sources (формат deb822). Если он уже есть
# (Docker ставили до нас), второй файл с тем же репозиторием не добавляем.
- name: Проверить, подключен ли репозиторий Docker в формате deb822
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/docker.sources
  register: docker_sources_deb822

# Файл пишется целиком (copy, а не apt_repository): так перезаписывается docker.list
# из старых инструкций с другим ключом, и apt не падает на конфликте Signed-By.
- name: Репозиторий Docker CE
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    mode: "0644"
  when: not docker_sources_deb822.stat.exists

- name: Ключ репозитория NVIDIA Container Toolkit
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

# То же имя файла, что в инструкции NVIDIA: наш файл заменяет ранее созданный.
- name: Репозиторий NVIDIA Container Toolkit
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    content: >
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
    mode: "0644"

# update_cache без cache_valid_time: репозитории могли только что добавиться.
- name: Установить Docker CE
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Установить NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: >-
      {{ 'nvidia-container-toolkit=' + nvidia_container_toolkit_version
         if nvidia_container_toolkit_version else 'nvidia-container-toolkit' }}
    state: present

- name: Docker в автозапуске
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Проверить, подключен ли runtime nvidia к Docker
  ansible.builtin.command: grep -q '"nvidia"' /etc/docker/daemon.json
  register: docker_nvidia_runtime
  changed_when: false
  failed_when: false
  check_mode: false

- name: Подключить runtime nvidia (nvidia-ctk runtime configure)
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when: docker_nvidia_runtime.rc != 0
  changed_when: true
  notify: Restart docker

- name: Применить перезапуск Docker до запуска контейнеров
  ansible.builtin.meta: flush_handlers

# Маленький образ CUDA той же версии, что у vLLM. Если драйвер слишком старый для этой
# версии CUDA, проверка упадет здесь с понятной ошибкой "unsatisfied condition: cuda>=...".
- name: Проверить доступ к GPU из контейнера
  ansible.builtin.command: docker run --rm --gpus all {{ docker_gpu_test_image }} nvidia-smi -L
  register: docker_gpu_test
  changed_when: false
  when: not ansible_check_mode
  tags: [docker_gpu_test]

- name: GPU, видимые в контейнере
  ansible.builtin.debug:
    var: docker_gpu_test.stdout_lines
  when: not ansible_check_mode
  tags: [docker_gpu_test]
