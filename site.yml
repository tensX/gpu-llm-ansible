---
- name: GPU-сервер с LLM (vLLM) за nginx
  hosts: gpu_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Проверить ОС
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
          - ansible_facts['distribution_version'] in supported_ubuntu_versions
        fail_msg: >-
          Поддерживаются Ubuntu {{ supported_ubuntu_versions | join(", ") }},
          на хосте {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
        quiet: true
      tags: [always]

    - name: Проверить, что задан ключ API
      ansible.builtin.assert:
        that:
          - vllm_api_key is defined
          - vllm_api_key | length >= 16
          - "'CHANGE_ME' not in vllm_api_key"
          # Только безопасные символы: ключ попадает в env-файл compose (там $ раскрывается)
          # и в заголовок Authorization.
          - vllm_api_key is match('^[A-Za-z0-9._~+/=-]+$')
        fail_msg: >-
          Задайте vllm_api_key (16+ символов: буквы, цифры, ._~+/=-) в group_vars/all/vault.yml
          через ansible-vault, см. README
        quiet: true
      tags: [always]

  roles:
    - { role: common, tags: [common] }
    - { role: nvidia_driver, tags: [nvidia] }
    - { role: docker, tags: [docker] }
    - { role: vllm, tags: [vllm] }
    - { role: api_gateway, tags: [gateway] }
    - { role: monitoring, tags: [monitoring], when: monitoring_enabled | bool }
    - { role: verify, tags: [verify] }
