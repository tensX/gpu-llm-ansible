---
- name: Обновить кеш apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Базовые пакеты
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Часовой пояс
  community.general.timezone:
    name: "{{ timezone }}"

# Сначала правило для SSH, потом политика deny и включение: доступ не теряется.
- name: Правило ufw для SSH
  community.general.ufw:
    rule: "{{ ssh_ufw_rule }}"
    port: "{{ ssh_port | string }}"
    proto: tcp

- name: Порты шлюза API
  ansible.builtin.set_fact:
    common_gateway_ports: "{{ [gateway_port] + ([gateway_tls_port] if gateway_tls_enabled | bool else []) }}"

- name: Правило ufw для API через nginx (со всех адресов)
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ common_gateway_ports }}"
  when: api_allowed_cidrs | length == 0

- name: Правило ufw для API через nginx (только разрешенные сети)
  community.general.ufw:
    rule: allow
    port: "{{ item.1 | string }}"
    proto: tcp
    from_ip: "{{ item.0 }}"
  loop: "{{ api_allowed_cidrs | product(common_gateway_ports) | list }}"

- name: Правило ufw для метрик (только сеть мониторинга)
  community.general.ufw:
    rule: allow
    port: "{{ item.1 | string }}"
    proto: tcp
    from_ip: "{{ item.0 }}"
  loop: "{{ metrics_allowed_cidrs | product([dcgm_exporter_port, node_exporter_port]) | list }}"
  when: monitoring_enabled | bool

- name: Политика ufw (входящие закрыты, исходящие открыты)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Включить ufw
  community.general.ufw:
    state: enabled
