---
# Рендер шаблонов docker compose с переменными из group_vars, чтобы в CI проверить их
# через "docker compose config":
#   ansible-playbook -i localhost, tests/render.yml -e render_dir=/tmp/compose
- name: Рендер шаблонов docker compose
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    render_dir: /tmp/compose
    # Не секрет: файл нужен только для проверки синтаксиса compose.
    vllm_api_key: "render-only-not-a-secret"
    hf_token: ""
    render_vllm_variants:
      - { name: vllm-all-gpus, gpus: "all", extra_args: [] }
      - { name: vllm-gpu-list, gpus: "0,1", extra_args: ["--quantization", "awq"], hf_token: "hf_render_only" }

  tasks:
    - name: Каталоги вариантов
      ansible.builtin.file:
        path: "{{ render_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ render_vllm_variants | map(attribute='name') | list + ['monitoring'] }}"

    - name: Шаблоны vLLM
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/roles/vllm/templates/{{ item.1 }}.j2"
        dest: "{{ render_dir }}/{{ item.0.name }}/{{ item.1 }}"
        mode: "0644"
      vars:
        vllm_gpus: "{{ item.0.gpus }}"
        vllm_extra_args: "{{ item.0.extra_args }}"
        hf_token: "{{ item.0.hf_token | default('') }}"
      loop: "{{ render_vllm_variants | product(['docker-compose.yml', 'vllm.env']) | list }}"

    - name: Шаблон мониторинга
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/roles/monitoring/templates/docker-compose.yml.j2"
        dest: "{{ render_dir }}/monitoring/docker-compose.yml"
        mode: "0644"
