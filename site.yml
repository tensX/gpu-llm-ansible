---
- name: GPU-сервер с LLM (vLLM) за nginx
  hosts: gpu_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Проверить ОС
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version in ["22.04", "24.04"]
        fail_msg: "Поддерживаются Ubuntu 22.04 и 24.04, на хосте {{ ansible_distribution }} {{ ansible_distribution_version }}"
        quiet: true
      tags: [always]

    - name: Проверить, что задан ключ API
      ansible.builtin.assert:
        that:
          - vllm_api_key is defined
          - vllm_api_key | length >= 16
          - "'CHANGE_ME' not in vllm_api_key"
        fail_msg: "Задайте vllm_api_key (16+ символов) в group_vars/all/vault.yml через ansible-vault, см. README"
        quiet: true
      tags: [always]

  roles:
    - { role: common, tags: [common] }
    - { role: nvidia_driver, tags: [nvidia] }
    - { role: docker, tags: [docker] }
    - { role: vllm, tags: [vllm] }
    - { role: api_gateway, tags: [gateway] }
    - { role: monitoring, tags: [monitoring], when: monitoring_enabled | bool }
    - { role: verify, tags: [verify] }
