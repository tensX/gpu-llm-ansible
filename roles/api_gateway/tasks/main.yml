---
- name: Установить nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Убрать сайт по умолчанию
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# Свой сертификат (от CA или Let's Encrypt) копируется с машины, где запускается Ansible.
# Ключ, зашифрованный ansible-vault, copy расшифровывает сам; diff выключен, чтобы ключ
# не попал в вывод --diff.
- name: Свой сертификат TLS
  ansible.builtin.copy:
    src: "{{ gateway_tls_cert_src }}"
    dest: "{{ gateway_tls_cert }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - gateway_tls_enabled | bool
    - gateway_tls_cert_src | length > 0
  notify: Reload nginx

- name: Свой ключ TLS
  ansible.builtin.copy:
    src: "{{ gateway_tls_key_src }}"
    dest: "{{ gateway_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  diff: false
  when:
    - gateway_tls_enabled | bool
    - gateway_tls_key_src | length > 0
  notify: Reload nginx

- name: Имена для самоподписанного сертификата (домен или имя хоста)
  ansible.builtin.set_fact:
    api_gateway_cert_names: >-
      {{ [ansible_facts['fqdn']] if gateway_server_name | trim in ['', '_'] else gateway_server_name.split() }}
  when: gateway_tls_enabled | bool

# Выпускается один раз (creates): после смены домена старый файл сертификата удалить.
- name: Самоподписанный сертификат на домен (если TLS включен и своего нет)
  ansible.builtin.command: >-
    openssl req -x509 -nodes -newkey rsa:2048 -days 365
    -subj "/CN={{ api_gateway_cert_names | first }}"
    -addext "subjectAltName=DNS:{{ api_gateway_cert_names | join(',DNS:') }}"
    -keyout {{ gateway_tls_key }}
    -out {{ gateway_tls_cert }}
  args:
    creates: "{{ gateway_tls_cert }}"
  when:
    - gateway_tls_enabled | bool
    - gateway_tls_self_signed | bool
    - gateway_tls_cert_src | length == 0
  notify: Reload nginx

- name: Права на ключ TLS
  ansible.builtin.file:
    path: "{{ gateway_tls_key }}"
    mode: "0600"
    owner: root
    group: root
  when:
    - gateway_tls_enabled | bool
    - not ansible_check_mode

- name: Зона rate limit
  ansible.builtin.template:
    src: ratelimit.conf.j2
    dest: /etc/nginx/conf.d/llm-ratelimit.conf
    mode: "0644"
  notify: Reload nginx

- name: Сайт LLM API
  ansible.builtin.template:
    src: llm-api.conf.j2
    dest: /etc/nginx/sites-available/llm-api.conf
    mode: "0644"
  notify: Reload nginx

- name: Включить сайт
  ansible.builtin.file:
    src: /etc/nginx/sites-available/llm-api.conf
    dest: /etc/nginx/sites-enabled/llm-api.conf
    state: link
  notify: Reload nginx

# Ошибка в конфиге остановит плейбук здесь, до reload: рабочий nginx не упадет.
- name: Проверить конфиг nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  when: not ansible_check_mode

- name: Автозапуск nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

# Без этого reload случился бы в конце плейбука, и роль verify на первом прогоне
# проверяла бы старый конфиг (сайт по умолчанию, который пакет nginx запускает сам).
- name: Применить конфиг nginx до проверок
  ansible.builtin.meta: flush_handlers
