---
- name: Установить nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Убрать сайт по умолчанию
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Самоподписанный сертификат (если TLS включен и своего нет)
  ansible.builtin.command: >-
    openssl req -x509 -nodes -newkey rsa:2048 -days 365
    -subj "/CN={{ ansible_fqdn }}"
    -keyout {{ gateway_tls_key }}
    -out {{ gateway_tls_cert }}
  args:
    creates: "{{ gateway_tls_cert }}"
  when:
    - gateway_tls_enabled | bool
    - gateway_tls_self_signed | bool
  notify: Reload nginx

- name: Права на ключ TLS
  ansible.builtin.file:
    path: "{{ gateway_tls_key }}"
    mode: "0600"
    owner: root
    group: root
  when:
    - gateway_tls_enabled | bool
    - not ansible_check_mode

- name: Зона rate limit
  ansible.builtin.template:
    src: ratelimit.conf.j2
    dest: /etc/nginx/conf.d/llm-ratelimit.conf
    mode: "0644"
  notify: Reload nginx

- name: Сайт LLM API
  ansible.builtin.template:
    src: llm-api.conf.j2
    dest: /etc/nginx/sites-available/llm-api.conf
    mode: "0644"
  notify: Reload nginx

- name: Включить сайт
  ansible.builtin.file:
    src: /etc/nginx/sites-available/llm-api.conf
    dest: /etc/nginx/sites-enabled/llm-api.conf
    state: link
  notify: Reload nginx

# Ошибка в конфиге остановит плейбук здесь, до reload: рабочий nginx не упадет.
- name: Проверить конфиг nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  when: not ansible_check_mode

- name: Автозапуск nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
